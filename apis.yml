aid: automox
name: Automox
description: >-
  Automox is a cloud-native IT operations and endpoint management platform
  that automates patching, configuration, and software deployment across
  Windows, macOS, and Linux devices from a single console. The Automox API
  is a REST API that gives developers programmatic access to organizations,
  zones, devices, groups, policies, packages, worklets, commands, events,
  reports, and users for building integrations and automating endpoint
  management workflows, authenticated with API keys.
type: Index
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - Endpoint Management
  - Patch Management
  - IT Operations
  - Device Management
  - Configuration Management
  - Security
url: >-
