apis:
  - aid: automox:api
    name: Automox API
    description: >-
      REST API for managing the Automox endpoint management platform
      including organizations, zones, devices, groups, policies, packages,
      worklets, commands, events, reports, and user accounts. Authentication
      uses an API key issued from the Automox console and rate limits are
      enforced per-user with a default of 100 authenticated requests per
      second.
